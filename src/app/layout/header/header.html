<header class="header-container">
    <a class="logo" routerLink="/">
        <img
            ngSrc="/images/limounapoli_logo.png"
            width="800"
            height="200"
            priority
            alt="Limounapoli"
        />
    </a>

    <nav class="nav-links">
        @for (link of links; track link.fragment) {
            <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
        }
        <a class="btn btn--accent" href="tel:+390000000000">Prenota</a>
    </nav>
</header>
